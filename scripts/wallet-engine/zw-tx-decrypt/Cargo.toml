[package]
name = "zw-tx-decrypt"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Zocial World (ADR-018 § 5/§ 6, Stage 2): trial-decrypts a Zcash transaction (Sapling, Orchard and Ironwood outputs) with a viewing key, for the game server's name-fee and transfer-fee checks"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
hex = "0.4.3"
bip0039 = "0.12.0"
# Same librustzcash family as the Stage-2 (Ironwood) wallet engine (WebZjs at the pinned revision +
# patches 0001-0005): versions here, exact git revisions in [patch.crates-io]
# below, and the engine's Cargo.lock copied in as this crate's lock by build-engine.sh.
zcash_client_backend = { version = "0.24.0-rc.1", default-features = false, features = ["orchard", "transparent-inputs"] }
zcash_primitives = { version = "0.29.0", default-features = false, features = ["std"] }
zcash_keys = { version = "0.15.0", features = ["transparent-inputs", "orchard", "sapling"] }
zcash_protocol = { version = "0.10.0", default-features = false }
zcash_address = { version = "0.13.0" }
zcash_transparent = { version = "0.9.0", default-features = false }
zip32 = { version = "0.2" }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
orchard = { version = "0.15", default-features = false }
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]

[patch.crates-io]
# EXACTLY the revisions the Stage-2 wallet engine (patched WebZjs, Cargo.toml [patch.crates-io]) builds
# with. (The engine also patches libsqlite3-sys and zcash_client_sqlite; the helper uses neither.)
orchard              = { git = "https://github.com/zcash/orchard.git", rev = "3bd2b736d1273226595773265313fc3f3428af16" }
equihash             = { git = "https://github.com/zcash/librustzcash", rev = "0a2c6d1ae6274e6af2291e312f7b7459516882f2" }
zcash_address        = { git = "https://github.com/zcash/librustzcash", rev = "0a2c6d1ae6274e6af2291e312f7b7459516882f2" }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "0a2c6d1ae6274e6af2291e312f7b7459516882f2" }
zcash_encoding       = { git = "https://github.com/zcash/librustzcash", rev = "0a2c6d1ae6274e6af2291e312f7b7459516882f2" }
zcash_keys           = { git = "https://github.com/zcash/librustzcash", rev = "0a2c6d1ae6274e6af2291e312f7b7459516882f2" }
zcash_protocol       = { git = "https://github.com/zcash/librustzcash", rev = "0a2c6d1ae6274e6af2291e312f7b7459516882f2" }
zip321               = { git = "https://github.com/zcash/librustzcash", rev = "0a2c6d1ae6274e6af2291e312f7b7459516882f2" }
zcash_primitives     = { git = "https://github.com/zcash/librustzcash", rev = "0a2c6d1ae6274e6af2291e312f7b7459516882f2" }
zcash_proofs         = { git = "https://github.com/zcash/librustzcash", rev = "0a2c6d1ae6274e6af2291e312f7b7459516882f2" }
pczt                 = { git = "https://github.com/zcash/librustzcash", rev = "0a2c6d1ae6274e6af2291e312f7b7459516882f2" }
zcash_transparent    = { git = "https://github.com/zcash/librustzcash", rev = "0a2c6d1ae6274e6af2291e312f7b7459516882f2" }
