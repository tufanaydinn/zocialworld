<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--zw:brand-head-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1430" />
    <title>Zocial World — a 3D social world for the Zcash community</title>
    <meta name="description" content="Zocial World is a browser-based 3D social world for the Zcash community: explore, chat, watch talks together in the Watch Hall, learn Zcash and send ZEC privately." />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0c10;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      #app {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <noscript>Zocial World is a 3D social world for the Zcash community. It runs in your browser and needs JavaScript and WebGL.</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
